name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      otp:
        description: 'npm 2FA OTP code (only if using NPM_TOKEN with 2FA)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Upgrade npm CLI for OIDC & staged publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build node package
        run: npm run build

      - name: Publish to npm with OIDC (direct or staged)
        run: |
          if npm publish --access public; then
            echo "Published directly via OIDC!"
            exit 0
          fi
          echo "Direct npm publish not enabled on Trusted Publisher; staging release via npm stage publish..."
          npm stage publish --access public
