name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      otp:
        description: 'npm 2FA OTP code (if using token requiring 2FA)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build node package
        run: npm run build

      - name: Publish to npm with provenance
        run: |
          if [ -n "${{ inputs.otp }}" ]; then
            npm publish --access public --provenance --otp="${{ inputs.otp }}"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
