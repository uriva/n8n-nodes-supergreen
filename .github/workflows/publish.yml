name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      otp:
        description: 'npm 2FA OTP code (only if using NPM_TOKEN with 2FA)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build node package
        run: npm run build

      - name: Publish to npm with provenance
        run: |
          SAVED_USERCONFIG="$NPM_CONFIG_USERCONFIG"
          # First try passwordless npm OIDC Trusted Publishing (no token or OTP needed)
          if (unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG && npm publish --access public --provenance); then
            exit 0
          fi
          echo "OIDC Trusted Publishing not configured yet; falling back to NPM_TOKEN..."
          export NPM_CONFIG_USERCONFIG="$SAVED_USERCONFIG"
          if [ -n "${{ inputs.otp }}" ]; then
            npm publish --access public --provenance --otp="${{ inputs.otp }}"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
